<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">SheetSQL Ergebnisansicht mit Filter und Sortierung</title>
  <desc id="desc">Synthetisches SQL-Ergebnis mit sortierter Umsatzspalte und aktivem Regionsfilter.</desc>
  <rect width="1400" height="760" fill="#f6f8f7"/>
  <rect x="0" y="0" width="1400" height="64" fill="#ffffff"/>
  <text x="32" y="41" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" font-weight="700" fill="#202522">SheetSQL</text>
  <text x="210" y="40" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" fill="#6b746f">SQL-Konsole</text>
  <rect x="320" y="15" width="156" height="35" rx="10" fill="#dcefe8"/>
  <text x="342" y="39" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" fill="#247c68">Ergebnis 1  ×</text>
  <line x1="0" y1="64" x2="1400" y2="64" stroke="#d8dfdb"/>
  <text x="34" y="111" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" font-weight="700" fill="#202522">Ergebnis</text>
  <text x="156" y="111" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" fill="#737d77">3 Zeilen</text>
  <rect x="1135" y="83" width="220" height="38" rx="10" fill="#e1f0eb"/>
  <text x="1160" y="108" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" fill="#247c68">CSV exportieren</text>
  <rect x="30" y="140" width="1340" height="34" rx="8" fill="#e1f0eb"/>
  <text x="48" y="163" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" fill="#247c68">Filter: Region = Süd   ×</text>
  <rect x="30" y="194" width="1340" height="426" rx="10" fill="#ffffff" stroke="#d8dfdb"/>
  <rect x="30" y="194" width="1340" height="48" rx="10" fill="#f1f5f3"/>
  <text x="55" y="224" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700" fill="#303733">#</text>
  <text x="125" y="224" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700" fill="#303733">Region</text>
  <text x="355" y="224" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700" fill="#247c68">Material</text>
  <text x="665" y="224" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700" fill="#247c68">Menge</text>
  <text x="890" y="224" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="700" fill="#247c68">Umsatz ↓</text>
  <text x="1140" y="224" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#77817b">Spaltenkopf: sortieren / filtern</text>
  <line x1="30" y1="242" x2="1370" y2="242" stroke="#d8dfdb"/>
  <g font-family="Menlo,monospace" font-size="15" fill="#303733">
    <text x="55" y="284">1</text><text x="125" y="284">Süd</text><text x="355" y="284">M-100</text><text x="665" y="284">48</text><text x="890" y="284">9.600,00</text>
    <text x="55" y="340">2</text><text x="125" y="340">Süd</text><text x="355" y="340">M-120</text><text x="665" y="340">32</text><text x="890" y="340">7.840,00</text>
    <text x="55" y="396">3</text><text x="125" y="396">Süd</text><text x="355" y="396">M-210</text><text x="665" y="396">27</text><text x="890" y="396">5.400,00</text>
  </g>
  <line x1="30" y1="302" x2="1370" y2="302" stroke="#edf0ee"/><line x1="30" y1="358" x2="1370" y2="358" stroke="#edf0ee"/><line x1="30" y1="414" x2="1370" y2="414" stroke="#edf0ee"/>
  <rect x="30" y="662" width="1340" height="54" rx="10" fill="#ffffff" stroke="#d8dfdb"/>
  <text x="52" y="696" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" fill="#68736d">Rechtsklick auf eine Zelle: Nur diesen Wert anzeigen oder ausschließen.</text>
