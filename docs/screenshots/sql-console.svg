  <text x="285" y="225" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" fill="#247c68">+</text>
  <text x="62" y="264" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" fill="#303733">▣  Region</text>
