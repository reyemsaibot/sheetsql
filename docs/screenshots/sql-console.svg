  <text x="555" y="180" font-family="Menlo,monospace" font-size="16" fill="#252a27">Region,</text>
  <text x="468" y="208" font-family="Menlo,monospace" font-size="16" fill="#252a27">       SUM(Umsatz) AS Gesamtumsatz</text>
  <text x="468" y="236" font-family="Menlo,monospace" font-size="16" fill="#1677d2">FROM</text>
  <text x="525" y="236" font-family="Menlo,monospace" font-size="16" fill="#168f94">&quot;Umsaetze&quot;</text>
  <text x="468" y="264" font-family="Menlo,monospace" font-size="16" fill="#1677d2">WHERE</text>
  <text x="545" y="264" font-family="Menlo,monospace" font-size="16" fill="#252a27">Umsatz &gt; 1000</text>
  <text x="468" y="292" font-family="Menlo,monospace" font-size="16" fill="#1677d2">GROUP BY</text>
  <text x="575" y="292" font-family="Menlo,monospace" font-size="16" fill="#252a27">Region</text>
  <text x="468" y="320" font-family="Menlo,monospace" font-size="16" fill="#1677d2">ORDER BY</text>
  <text x="575" y="320" font-family="Menlo,monospace" font-size="16" fill="#252a27">Gesamtumsatz DESC;</text>
  <text x="395" y="454" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" fill="#707a74">Spalten anklicken, um korrekt zitierte Namen an der Cursorposition einzufügen.</text>
