  <text x="399" y="120" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="600" fill="#247c68">SQL-Abfrage</text>
  <text x="1260" y="120" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" fill="#247c68">▶  Ausführen</text>
  <rect x="405" y="151" width="44" height="230" fill="#f5f7f6"/>
